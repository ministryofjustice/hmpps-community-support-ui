name: branch-name-validator

on: [ pull_request ]

jobs:
  check-jira-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: deepakputhraya/action-branch-name@5f1cc199284b75145ec2d13434422e6987cf6af8 # master
        with:
          regex: '^(no-ticket/|renovate[-/]|hotfix/|FRI-[0-9]+/|IPB-[0-9]+/)' # start branch with either 'no-ticket/' or 'FRI-NUMBER/' or 'IPB-NUMBER/', allowing for bots and hotfixes
          ignore: main
